<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mini Code Editor</title>

<script>
  window.__cmFailedScripts = [];
  window.__cmLoadError = function(src){ window.__cmFailedScripts.push(src); };
</script>

<style>
  :root{
    --bg-titlebar:#3c3c3c;
    --bg-sidebar:#252526;
    --bg-editor:#1e1e1e;
    --bg-tabs:#2d2d2d;
    --bg-tab-active:#1e1e1e;
    --bg-statusbar:#007acc;
    --fg:#cccccc;
    --fg-dim:#8a8a8a;
    --accent:#0a84ff;
    --border:#1b1b1b;
    --hover:#2a2d2e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:"Segoe UI","Yu Gothic UI",-apple-system,sans-serif;
    background:var(--bg-editor);color:var(--fg);
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh;}

  #titlebar{
    height:30px;background:var(--bg-titlebar);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#e0e0e0;flex-shrink:0;
    -webkit-user-select:none;user-select:none;
    border-bottom:1px solid var(--border);
  }
  #main{flex:1;display:flex;min-height:0;}

  /* ---- Sidebar (file explorer) ---- */
  #sidebar{
    width:230px;background:var(--bg-sidebar);flex-shrink:0;
    display:flex;flex-direction:column;font-size:13px;
    border-right:1px solid var(--border);min-width:160px;overflow:hidden;
  }
  #sidebar-title{
    padding:10px 14px 6px 20px;font-size:11px;letter-spacing:.5px;color:#bbbbbb;
    text-transform:uppercase;-webkit-user-select:none;user-select:none;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .sidebar-actions{display:flex;gap:2px;}
  .icon-btn{
    background:transparent;border:none;color:#cccccc;cursor:pointer;
    font-size:12px;padding:2px 4px;border-radius:3px;line-height:1;
  }
  .icon-btn:hover{background:var(--hover);}
  #file-tree{flex:1;overflow-y:auto;min-height:0;}
  .folder-row{
    padding:4px 6px 4px 8px;display:flex;align-items:center;gap:5px;
    color:#cccccc;cursor:pointer;-webkit-user-select:none;user-select:none;font-weight:600;
  }
  .folder-row:hover{background:var(--hover);}
  .folder-row .row-actions{margin-left:auto;display:flex;gap:1px;opacity:0;transition:opacity .1s;}
  .folder-row:hover .row-actions{opacity:1;}
  .caret{display:inline-block;width:10px;font-size:9px;color:#8a8a8a;flex-shrink:0;text-align:center;}
  .file-row{
    padding:4px 8px 4px 28px;display:flex;align-items:center;gap:6px;
    cursor:pointer;-webkit-user-select:none;user-select:none;color:#cccccc;
  }
  .file-row:hover{background:var(--hover);}
  .file-row.active{background:#37373d;}
  .file-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#1e1e1e;}

  #sidebar-footer{flex-shrink:0;border-top:1px solid var(--border);}
  .footer-buttons{display:flex;flex-direction:column;gap:4px;padding:8px 10px;}
  .footer-buttons button{
    background:#3a3d41;border:1px solid #555;color:#cccccc;border-radius:4px;
    font-size:11px;padding:5px 8px;cursor:pointer;text-align:left;
  }
  .footer-buttons button:hover{background:#45494e;}
  #sidebar-hint{
    padding:8px 14px 10px;font-size:11px;color:var(--fg-dim);line-height:1.5;
  }
  #sidebar-hint b{color:#dcdcaa;}
  #sidebar-hint code{background:#333;padding:1px 4px;border-radius:3px;}

  /* ---- Editor area ---- */
  #editor-area{
    flex:1;display:flex;flex-direction:column;min-width:200px;background:var(--bg-editor);
  }
  #tabs{
    display:flex;background:var(--bg-tabs);flex-shrink:0;height:35px;
    border-bottom:1px solid var(--border);-webkit-user-select:none;user-select:none;
    overflow-x:auto;
  }
  .tab{
    display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;height:100%;
    font-size:13px;color:#969696;background:var(--bg-tabs);
    border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:var(--bg-tab-active);color:#ffffff;border-top:1px solid var(--accent);}
  .tab .file-dot{width:8px;height:8px;border-radius:50%;}
  .tab-close{margin-left:2px;opacity:.55;padding:0 4px;border-radius:3px;font-size:14px;line-height:1.4;}
  .tab-close:hover{opacity:1;background:#484848;}

  #editor-wrap{flex:1;position:relative;min-height:0;}
  #monaco-container{position:absolute;inset:0;}
  #empty-state{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:var(--fg-dim);font-size:13px;background:var(--bg-editor);
  }
  #empty-state button{
    background:#3a3d41;border:1px solid #555;color:#cccccc;border-radius:4px;
    font-size:12px;padding:6px 14px;cursor:pointer;
  }
  #empty-state button:hover{background:#45494e;}

  /* ---- Preview panel ---- */
  #preview-panel{
    width:42%;min-width:220px;display:flex;flex-direction:column;background:#ffffff;flex-shrink:0;
  }
  #preview-header{
    height:35px;background:var(--bg-tabs);display:flex;align-items:center;
    justify-content:space-between;padding:0 12px;font-size:12px;color:#cccccc;
    border-bottom:1px solid var(--border);flex-shrink:0;-webkit-user-select:none;user-select:none;
  }
  #preview-header .dot-group{display:flex;gap:6px;}
  #preview-header .dot{width:10px;height:10px;border-radius:50%;}
  #preview-header button{
    background:#3a3d41;border:1px solid #555;color:#cccccc;border-radius:4px;
    font-size:11px;padding:3px 9px;cursor:pointer;
  }
  #preview-header button:hover{background:#45494e;}
  #preview-frame{flex:1;border:none;background:#ffffff;}

  /* ---- Status bar ---- */
  #statusbar{
    height:22px;background:var(--bg-statusbar);color:#ffffff;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;padding:0 10px;-webkit-user-select:none;user-select:none;
  }
  #statusbar .left, #statusbar .right{display:flex;gap:16px;align-items:center;}
  #wrap-toggle{cursor:pointer;background:rgba(255,255,255,0.15);border-radius:3px;padding:0 6px;}
  #wrap-toggle.on{background:rgba(255,255,255,0.35);}

  /* resizers */
  .resizer{width:4px;cursor:col-resize;background:transparent;flex-shrink:0;}
  .resizer:hover, .resizer.dragging{background:var(--accent);}

  /* ---- Error banner ---- */
  #error-banner{
    display:none;background:#5a1d1d;color:#ffd7d7;font-size:12px;
    padding:6px 12px;border-bottom:1px solid #7a2a2a;flex-shrink:0;
    white-space:pre-wrap;
  }
  #error-banner.show{display:block;}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">NameBy nori-Pixl  Web Studio code  ver12.5  PowerBy Monaco Editor</div>
  <div id="error-banner"></div>

  <div id="main">
    <div id="sidebar">
      <div id="sidebar-title">
        <span>エクスプローラー</span>
        <span class="sidebar-actions">
          <button class="icon-btn" id="add-root-file" title="新規ファイル">📄+</button>
          <button class="icon-btn" id="add-root-folder" title="新規フォルダ">📁+</button>
        </span>
      </div>
      <div class="folder-row" style="cursor:default;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#c09553"><path d="M3 5h6l2 2h10v12H3z"/></svg>
        MY-PROJECT
      </div>
      <div id="file-tree"></div>
      <div id="sidebar-footer">
        <div class="footer-buttons">
          <button id="export-json-btn">📥 JSONで保存</button>
          <button id="import-json-btn">📤 JSONを読み込む</button>
          <input type="file" id="import-json-input" accept="application/json" style="display:none">
        </div>
        <div id="sidebar-hint">
          画像ファイルの追加は禁止です。<br>
          画像を使いたい場合は <b>imgur</b> などの外部URLを<br>
          <code>&lt;img src="https://i.imgur.com/xxxx.png"&gt;</code><br>
          のように記述してください。プレビューは <code>index.html</code> を本体として、全ての <code>.css</code> / <code>.js</code> をまとめて読み込みます。
        </div>
      </div>
    </div>

    <div class="resizer" id="resizer-left"></div>

    <div id="editor-area">
      <div id="tabs"></div>
      <div id="editor-wrap">
        <div id="monaco-container"></div>
        <div id="empty-state">
          <span>開いているファイルがありません</span>
          <button id="empty-add-file-btn">📄+ 新しいファイルを作成</button>
        </div>
      </div>
    </div>

    <div class="resizer" id="resizer-right"></div>

    <div id="preview-panel">
      <div id="preview-header">
        <div class="dot-group">
          <span class="dot" style="background:#ff5f57;"></span>
          <span class="dot" style="background:#febc2e;"></span>
          <span class="dot" style="background:#28c840;"></span>
        </div>
        <span>ライブプレビュー</span>
        <button id="refresh-btn">再読み込み</button>
      </div>
      <iframe id="preview-frame" title="live preview"></iframe>
    </div>
  </div>

  <div id="statusbar">
    <div class="left">
      <span>⚡ 準備完了</span>
      <span id="current-file-label">index.html</span>
    </div>
    <div class="right">
      <span id="cursor-pos">行 1, 列 1</span>
      <span id="wrap-toggle" class="on">折り返し: ON</span>
      <span>UTF-8</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs/loader.js" onerror="window.__cmLoadError && window.__cmLoadError(this.src)"></script>

<script>
(function(){
  function showFatalError(msg){
    const el = document.getElementById('error-banner');
    if(!el) return;
    el.textContent = '⚠ ' + msg;
    el.classList.add('show');
  }
  window.addEventListener('error', function(e){
    showFatalError('スクリプトの読み込みまたは実行でエラーが発生しました: ' + (e.message || e.error || '不明なエラー'));
  });

  if(!window.require){
    showFatalError('Monaco Editor (loader.js) の読み込みに失敗しました（ネットワーク接続や外部CDNへのアクセスを確認してください）。');
    return;
  }
  if(window.__cmFailedScripts && window.__cmFailedScripts.length){
    showFatalError('以下のファイルの読み込みに失敗しました:\n' + window.__cmFailedScripts.join('\n'));
  }

  const DEFAULT = {
    html: `<!-- index.html -->
<h1>Hello, VSCode 風エディター</h1>
<p>左のファイルを切り替えて編集してください。</p>
<p>画像を使いたいときは imgur の直リンクを使ってね。</p>
<img src="https://i.imgur.com/8fWjUOc.png" alt="サンプル画像" width="120">
<button id="btn">クリックしてね</button>`,
    css: `/* style.css */
body{
  font-family: sans-serif;
  padding: 24px;
  background: #fafafa;
  color: #222;
}
h1{ color: #0a84ff; }
button{
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: #0a84ff;
  color: #fff;
  cursor: pointer;
}
button:hover{ background:#006fd6; }`,
    js: `// script.js
document.getElementById('btn').addEventListener('click', () => {
  alert('動いてます！');
});`
  };

  const EXT_LANG = { html:'html', htm:'html', css:'css', js:'javascript', mjs:'javascript', json:'json', md:'markdown', xml:'xml', txt:'plaintext' };
  const EXT_COLOR = { html:'#e34c26', htm:'#e34c26', css:'#2965f1', js:'#f0db4f', mjs:'#f0db4f', json:'#8bc34a', md:'#42a5f5', xml:'#ff7043', txt:'#9e9e9e' };

  function extOf(name){ const m = /\.([a-zA-Z0-9]+)$/.exec(name); return m ? m[1].toLowerCase() : ''; }
  function langForName(name){ return EXT_LANG[extOf(name)] || 'plaintext'; }
  function fileDotHtml(name, withLetter){
    const ext = extOf(name);
    const color = EXT_COLOR[ext] || '#9e9e9e';
    const letter = withLetter ? (ext ? ext[0].toUpperCase() : '?') : '';
    return `<span class="file-dot" style="background:${color}">${letter}</span>`;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function newId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  // ---- state ----
  let nodes = {};
  let rootId = 'root';
  let openTabs = [];
  let activeId = null;
  let editor = null;
  const models = {};
  let wrapOn = true;
  const STORAGE_KEY = 'mini-code-editor:project:v1';
  let autosaveTimer = null;
  let previewTimer = null;

  function setupDefaultProject(){
    nodes = {};
    rootId = 'root';
    nodes[rootId] = { id: rootId, type:'folder', name:'MY-PROJECT', parentId:null, children:[], collapsed:false };
    const f1 = addNodeSilent(rootId, 'file', 'index.html', DEFAULT.html);
    const f2 = addNodeSilent(rootId, 'file', 'style.css', DEFAULT.css);
    const f3 = addNodeSilent(rootId, 'file', 'script.js', DEFAULT.js);
    openTabs = [f1, f2, f3];
    activeId = f1;
  }
  function addNodeSilent(parentId, type, name, content){
    const id = newId(type === 'file' ? 'n' : 'd');
    if(type === 'file') nodes[id] = { id, type:'file', name, parentId, lang: langForName(name), content: content || '' };
    else nodes[id] = { id, type:'folder', name, parentId, children:[], collapsed:false };
    nodes[parentId].children.push(id);
    return id;
  }

  // ---- persistence ----
  function serializeProject(){ return { version:1, nodes, rootId, openTabs, activeId }; }
  function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(saveToLocalStorage, 400); }
  function saveToLocalStorage(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeProject())); }
    catch(e){ console.warn('localStorageへの保存に失敗:', e); }
  }
  function loadFromLocalStorage(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data || !data.nodes || !data.rootId) return null;
      return data;
    }catch(e){ console.warn('localStorageの読み込みに失敗:', e); return null; }
  }

  // ---- tree helpers ----
  function sortedChildren(folderId){
    const folder = nodes[folderId];
    return folder.children.slice().sort((a,b) => {
      const na = nodes[a], nb = nodes[b];
      if(na.type !== nb.type) return na.type === 'folder' ? -1 : 1;
      return na.name.localeCompare(nb.name, 'ja');
    });
  }
  function walkFiles(folderId, cb){
    sortedChildren(folderId).forEach(id => {
      const n = nodes[id];
      if(n.type === 'folder') walkFiles(id, cb);
      else cb(n);
    });
  }
  function findIndexHtml(){
    let found = null;
    walkFiles(rootId, n => { if(!found && n.name.toLowerCase() === 'index.html') found = n; });
    return found;
  }
  function collectByExt(exts){
    const list = [];
    walkFiles(rootId, n => { if(exts.includes(extOf(n.name))) list.push(n.content || ''); });
    return list;
  }

  // ---- rendering ----
  function renderTree(){
    const container = document.getElementById('file-tree');
    container.innerHTML = '';
    renderFolderChildren(rootId, container, 0);
  }
  function renderFolderChildren(folderId, container, depth){
    sortedChildren(folderId).forEach(id => {
      const n = nodes[id];
      if(n.type === 'folder'){
        const row = document.createElement('div');
        row.className = 'folder-row';
        row.style.paddingLeft = (8 + depth * 14) + 'px';
        row.innerHTML = `
          <span class="caret">${n.collapsed ? '▸' : '▾'}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#c09553"><path d="M3 5h6l2 2h10v12H3z"/></svg>
          <span class="folder-name">${escapeHtml(n.name)}</span>
          <span class="row-actions">
            <button class="icon-btn add-file-here" title="ここにファイルを追加">📄+</button>
            <button class="icon-btn add-folder-here" title="ここにフォルダを追加">📁+</button>
          </span>`;
        row.addEventListener('click', (e) => {
          if(e.target.closest('.icon-btn')) return;
          n.collapsed = !n.collapsed;
          renderTree();
        });
        row.querySelector('.add-file-here').addEventListener('click', (e) => { e.stopPropagation(); addFile(id); });
        row.querySelector('.add-folder-here').addEventListener('click', (e) => { e.stopPropagation(); addFolder(id); });
        container.appendChild(row);
        if(!n.collapsed) renderFolderChildren(id, container, depth + 1);
      } else {
        const row = document.createElement('div');
        row.className = 'file-row' + (id === activeId ? ' active' : '');
        row.style.paddingLeft = (28 + depth * 14) + 'px';
        row.innerHTML = `${fileDotHtml(n.name, true)} <span class="file-name">${escapeHtml(n.name)}</span>`;
        row.addEventListener('click', () => openFile(id));
        container.appendChild(row);
      }
    });
  }
  function renderTabs(){
    const container = document.getElementById('tabs');
    container.innerHTML = '';
    openTabs.forEach(id => {
      const n = nodes[id];
      if(!n) return;
      const tab = document.createElement('div');
      tab.className = 'tab' + (id === activeId ? ' active' : '');
      tab.innerHTML = `${fileDotHtml(n.name, false)}<span class="tab-name">${escapeHtml(n.name)}</span><span class="tab-close" title="閉じる">×</span>`;
      tab.addEventListener('click', () => openFile(id));
      tab.querySelector('.tab-close').addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });
      container.appendChild(tab);
    });
  }

  // ---- file/folder creation ----
  function addFile(parentId){
    const name = prompt('新しいファイル名を入力してください(例: about.html)', 'newfile.html');
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed || /[\/\\]/.test(trimmed)){ alert('ファイル名が不正です'); return; }
    const parent = nodes[parentId];
    if(parent.children.some(cid => nodes[cid].name === trimmed)){ alert('同じ名前のファイル/フォルダが既に存在します'); return; }
    const id = newId('n');
    nodes[id] = { id, type:'file', name: trimmed, parentId, lang: langForName(trimmed), content: '' };
    parent.children.push(id);
    parent.collapsed = false;
    openFile(id);
  }
  function addFolder(parentId){
    const name = prompt('新しいフォルダ名を入力してください', 'new-folder');
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed || /[\/\\]/.test(trimmed)){ alert('フォルダ名が不正です'); return; }
    const parent = nodes[parentId];
    if(parent.children.some(cid => nodes[cid].name === trimmed)){ alert('同じ名前のファイル/フォルダが既に存在します'); return; }
    const id = newId('d');
    nodes[id] = { id, type:'folder', name: trimmed, parentId, children:[], collapsed:false };
    parent.children.push(id);
    parent.collapsed = false;
    renderTree();
    scheduleAutosave();
  }

  // ---- tab / model management ----
  function ensureModel(id){
    if(models[id]) return models[id];
    const node = nodes[id];
    const model = monaco.editor.createModel(node.content || '', node.lang || 'plaintext');
    model.onDidChangeContent(() => {
      node.content = model.getValue();
      renderPreview();
      scheduleAutosave();
    });
    models[id] = model;
    return model;
  }
  function showEditorPane(){ document.getElementById('empty-state').style.display = 'none'; }
  function showEmptyState(){
    document.getElementById('empty-state').style.display = 'flex';
    document.getElementById('current-file-label').textContent = '(ファイルなし)';
  }
  function openFile(id){
    if(!nodes[id] || nodes[id].type !== 'file') return;
    if(!openTabs.includes(id)) openTabs.push(id);
    activeId = id;
    ensureModel(id);
    showEditorPane();
    editor.setModel(models[id]);
    editor.focus();
    document.getElementById('current-file-label').textContent = nodes[id].name;
    renderTabs();
    renderTree();
    updateCursorPos();
    scheduleAutosave();
  }
  function closeTab(id){
    const idx = openTabs.indexOf(id);
    if(idx === -1) return;
    openTabs.splice(idx, 1);
    if(activeId === id){
      if(openTabs.length){
        activeId = openTabs[Math.max(0, idx - 1)];
        showEditorPane();
        editor.setModel(models[activeId]);
        document.getElementById('current-file-label').textContent = nodes[activeId].name;
        updateCursorPos();
      } else {
        activeId = null;
        showEmptyState();
      }
    }
    renderTabs();
    renderTree();
    scheduleAutosave();
  }
  function updateCursorPos(){
    if(!editor) return;
    const pos = editor.getPosition();
    if(!pos) return;
    document.getElementById('cursor-pos').textContent = `行 ${pos.lineNumber}, 列 ${pos.column}`;
  }

  // ---- live preview ----
  function renderPreview(){
    clearTimeout(previewTimer);
    previewTimer = setTimeout(() => {
      const indexNode = findIndexHtml();
      const bodyHtml = indexNode ? (indexNode.content || '') : '<p style="font-family:sans-serif;color:#888;padding:24px;">index.html が見つかりません</p>';
      const css = collectByExt(['css']).join('\n');
      const js = collectByExt(['js','mjs']).join('\n');
      const doc = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>${css}</style></head>
<body>${bodyHtml}
<script>${js}<\/script>
</body>
</html>`;
      document.getElementById('preview-frame').srcdoc = doc;
    }, 250);
  }

  // ---- JSON export / import ----
  function setupImportExport(){
    document.getElementById('export-json-btn').addEventListener('click', () => {
      try{
        const data = serializeProject();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mini-code-editor-project.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }catch(e){
        console.error('エクスポート失敗:', e);
        alert('エクスポートに失敗しました。プレビュー環境の制限の可能性があります。通常のブラウザタブで開いて試してください。');
      }
    });
    document.getElementById('import-json-btn').addEventListener('click', () => {
      document.getElementById('import-json-input').click();
    });
    document.getElementById('import-json-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{ applyProjectData(JSON.parse(reader.result)); }
        catch(err){ alert('JSONの読み込みに失敗しました: ' + err.message); }
      };
      reader.readAsText(file);
      e.target.value = '';
    });
  }
  function applyProjectData(data){
    if(!data || !data.nodes || !data.rootId){ alert('不正なプロジェクトファイルです'); return; }
    Object.values(models).forEach(m => { try{ m.dispose(); }catch(e){} });
    Object.keys(models).forEach(k => delete models[k]);
    nodes = data.nodes;
    rootId = data.rootId;
    openTabs = Array.isArray(data.openTabs) ? data.openTabs.filter(id => nodes[id] && nodes[id].type === 'file') : [];
    activeId = (data.activeId && nodes[data.activeId]) ? data.activeId : (openTabs[0] || null);
    if(activeId && !openTabs.includes(activeId)) openTabs.push(activeId);
    renderTree();
    renderTabs();
    if(activeId){
      ensureModel(activeId);
      showEditorPane();
      editor.setModel(models[activeId]);
      document.getElementById('current-file-label').textContent = nodes[activeId].name;
    } else {
      showEmptyState();
    }
    updateCursorPos();
    renderPreview();
    scheduleAutosave();
  }

  // ---- resizers ----
  function setupResizers(){
    const main = document.getElementById('main');
    const sidebar = document.getElementById('sidebar');
    const previewPanel = document.getElementById('preview-panel');
    const left = document.getElementById('resizer-left');
    const right = document.getElementById('resizer-right');
    let draggingLeft = false, draggingRight = false;

    left.addEventListener('mousedown', () => { draggingLeft = true; left.classList.add('dragging'); });
    right.addEventListener('mousedown', () => { draggingRight = true; right.classList.add('dragging'); });
    window.addEventListener('mousemove', (e) => {
      if(!draggingLeft && !draggingRight) return;
      const mainRect = main.getBoundingClientRect();
      if(draggingLeft){
        let w = e.clientX - mainRect.left;
        w = Math.max(160, Math.min(w, mainRect.width - previewPanel.getBoundingClientRect().width - 300));
        sidebar.style.width = w + 'px';
      }
      if(draggingRight){
        let w = mainRect.right - e.clientX;
        w = Math.max(220, Math.min(w, mainRect.width - sidebar.getBoundingClientRect().width - 300));
        previewPanel.style.width = w + 'px';
      }
      if(editor) editor.layout();
    });
    window.addEventListener('mouseup', () => {
      draggingLeft = false; draggingRight = false;
      left.classList.remove('dragging'); right.classList.remove('dragging');
    });
  }

  // ---- Monaco worker fix (sandboxed iframe向け) ----
  const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs';
  window.MonacoEnvironment = {
    getWorkerUrl: function(){
      return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
        `self.MonacoEnvironment = { baseUrl: '${MONACO_BASE}/../' };\n` +
        `importScripts('${MONACO_BASE}/base/worker/workerMain.js');`
      );
    }
  };
  require.config({ paths: { vs: MONACO_BASE } });
  window.require.onError = function(err){
    console.error('[monaco] require エラー:', err);
    showFatalError('Monaco Editor のモジュール読み込みに失敗しました: ' + (err && err.message ? err.message : String(err)));
  };

  require(['vs/editor/editor.main'], function(){
    try{ init(); }
    catch(e){ console.error('Monaco 初期化失敗:', e); showFatalError('エディターの初期化に失敗しました: ' + e.message); }
  }, function(err){
    console.error('[monaco] モジュール読み込み失敗:', err);
    showFatalError('Monaco Editor 本体の読み込みに失敗しました（ネットワーク接続や外部CDNへのアクセスを確認してください）。');
  });

  function init(){
    const loaded = loadFromLocalStorage();
    if(loaded){
      nodes = loaded.nodes;
      rootId = loaded.rootId;
      openTabs = Array.isArray(loaded.openTabs) ? loaded.openTabs.filter(id => nodes[id] && nodes[id].type === 'file') : [];
      activeId = (loaded.activeId && nodes[loaded.activeId]) ? loaded.activeId : (openTabs[0] || null);
    } else {
      setupDefaultProject();
    }

    editor = monaco.editor.create(document.getElementById('monaco-container'), {
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 14,
      fontFamily: '"Cascadia Code","Consolas","SF Mono",monospace',
      tabSize: 2,
      insertSpaces: true,
      wordWrap: wrapOn ? 'on' : 'off',
      minimap: { enabled: false },
      autoClosingTags: true,
      autoClosingBrackets: 'always',
      autoClosingQuotes: 'always',
      autoSurround: 'languageDefined',
      quickSuggestions: true,
      suggestOnTriggerCharacters: true,
      wordBasedSuggestions: 'currentDocument',
      scrollBeyondLastLine: false,
      renderWhitespace: 'selection'
    });
    editor.onDidChangeCursorPosition(updateCursorPos);

    renderTree();
    renderTabs();
    if(activeId && nodes[activeId]){
      ensureModel(activeId);
      editor.setModel(models[activeId]);
      document.getElementById('current-file-label').textContent = nodes[activeId].name;
      showEditorPane();
    } else {
      showEmptyState();
    }
    updateCursorPos();
    renderPreview();

    document.getElementById('add-root-file').addEventListener('click', () => addFile(rootId));
    document.getElementById('add-root-folder').addEventListener('click', () => addFolder(rootId));
    document.getElementById('empty-add-file-btn').addEventListener('click', () => addFile(rootId));
    document.getElementById('refresh-btn').addEventListener('click', renderPreview);
    document.getElementById('wrap-toggle').addEventListener('click', () => {
      wrapOn = !wrapOn;
      editor.updateOptions({ wordWrap: wrapOn ? 'on' : 'off' });
      const el = document.getElementById('wrap-toggle');
      el.textContent = '折り返し: ' + (wrapOn ? 'ON' : 'OFF');
      el.classList.toggle('on', wrapOn);
    });

    setupImportExport();
    setupResizers();
  }
})();
</script>
</body>
</html>
